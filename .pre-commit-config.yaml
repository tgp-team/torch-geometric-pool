repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3           # pin to an exact tag; keep in sync with pyproject.toml
    hooks:
      - id: ruff           # lint + import-sort (autofix with --fix)
        args: [--fix]
      - id: ruff-format    # apply Ruff's code formatter
